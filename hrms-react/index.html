<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- /vite.svg never existed in this project, so the favicon has always
         404'd. public/icon.svg is the same file the PWA manifest uses. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR Management System</title>
    <!-- Web Push on iOS works ONLY when the site is installed to the Home
         Screen as a PWA (iOS 16.4+), which needs this manifest. On desktop it
         is optional; it costs nothing and is the difference between "works on
         my laptop" and an iPhone demo. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1359e1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
